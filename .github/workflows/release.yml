name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.10.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Reject the obsolete dual-authority publication path
        run: |
          echo "::error::Agent Sandbox releases must upload the exact certified consumer-rooted bundle via agent-release-manager."
          echo "::error::The generic reactor rebuild cannot establish publication-SBOM identity before SCA."
          exit 1
