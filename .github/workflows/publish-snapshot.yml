name: Publish Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Pinned to an immutable build-tools commit so a change to that repository's
    # default branch cannot alter this repository's publication without review.
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@76a0c8c0d223b62e49619c45e0c0a7b15e1bf3cc
    with:
      java-version: '21'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
