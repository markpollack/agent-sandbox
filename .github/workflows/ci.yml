name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Pinned to an immutable build-tools commit so a change to that repository's
    # default branch cannot alter this repository's build without review.
    uses: markpollack/build-tools/.github/workflows/ci-build.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '21'
